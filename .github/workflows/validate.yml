name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Static validation
        run: ./validate.sh --shellcheck --install-audit

      - name: Install profile validation
        run: ./setup.sh research --validate && ./setup.sh dev-full --validate

      - name: Smoke tests (CI mode)
        run: ./smoke_test.sh --ci
